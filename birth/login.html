<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in | NATUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-atmosphere"></div>

<div class="auth-container">
    <div style="width:min(680px, 100%);">
        <div class="reveal is-visible" style="text-align:center; margin-bottom:10px;">
            <span class="eyebrow">CHOOSE YOUR PORTAL</span>
            <h1 style="margin-top:10px; font-size:2rem;">Welcome to NATUS</h1>
            <p style="margin-top:8px;">Select how you'd like to sign in.</p>
        </div>

        <div class="portal-grid">
            <!-- Parent / applicant portal -->
            <div class="portal-card reveal is-visible">
                <i class="fa-solid fa-people-roof"></i>
                <h2>Parent portal</h2>
                <p>Register births and monitor your application status.</p>
                <a href="parentlog.html" class="btn btn-primary btn-block">Continue</a>
            </div>

            <!-- Registrar / admin portal -->
            <div class="portal-card reveal is-visible">
                <i class="fa-solid fa-building-shield"></i>
                <h2>Admin portal</h2>
                <p>Verify applications, approve records, and generate certificates.</p>
                <a href="admin-login.html" class="btn btn-magenta btn-block">Continue</a>
            </div>
        </div>

        <p style="text-align:center; margin-top:26px; font-size:.85rem;">
            New here? <a href="signup.html" style="color:var(--cyan); font-weight:600;">Create a parent account</a>
        </p>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    Natus.nav.init([
        { label: 'Home',    href: 'index.html', icon: 'fa-house' },
        { label: 'Sign up',  href: 'signup.html', icon: 'fa-user-plus' },
        { label: 'Sign in',  href: 'login.html',  icon: 'fa-right-to-bracket', current: true },
    ]);
</script>
</body>
</html>
