<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | NATUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="bg-atmosphere"></div>

<div class="dashboard">
    <main class="main-content">

        <div class="topbar reveal is-visible">
            <div>
                <h1>Registry reports</h1>
                <p>Aggregate insight across every submitted application.</p>
            </div>
            <div class="live-date">
                <h3 id="currentDate"></h3>
                <h2 id="currentTime"></h2>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card"><i class="fa-solid fa-file-circle-check"></i><div><h2 id="statTotal">0</h2><p>Total applications</p></div></div>
            <div class="stat-card"><i class="fa-solid fa-percent"></i><div><h2 id="statApprovalRate">0%</h2><p>Approval rate</p></div></div>
            <div class="stat-card"><i class="fa-solid fa-hospital"></i><div><h2 id="statHospitals">0</h2><p>Facilities represented</p></div></div>
            <div class="stat-card"><i class="fa-solid fa-venus-mars"></i><div><h2 id="statGenderSplit">—</h2><p>Female / Male</p></div></div>
        </div>

        <div class="dashboard-content">
            <div class="chart-card">
                <h2>Applications by status</h2>
                <canvas id="statusBarChart" height="180"></canvas>
            </div>
            <div class="chart-card">
                <h2>Top hospitals by submissions</h2>
                <canvas id="hospitalChart" height="180"></canvas>
            </div>
        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script>
    const session = Natus.auth.requireRole('admin');

    Natus.nav.init([
        { label: 'Dashboard', href: 'admindash.html', icon: 'fa-chart-line' },
        { label: 'Reports',   href: 'reports.html',   icon: 'fa-file-lines', current: true },
        { label: 'Records',   href: 'records.html',   icon: 'fa-box-archive' },
    ]);

    Natus.fx.initClock();

    const records = Natus.db.getApplications();

    /* ---- top stat cards ---- */
    const approved = records.filter(r => r.status === 'approved').length;
    document.getElementById('statTotal').textContent = records.length;
    document.getElementById('statApprovalRate').textContent = records.length
        ? Math.round((approved / records.length) * 100) + '%' : '0%';

    const hospitals = [...new Set(records.map(r => r.hospital).filter(Boolean))];
    document.getElementById('statHospitals').textContent = hospitals.length;

    const female = records.filter(r => r.gender === 'Female').length;
    const male = records.filter(r => r.gender === 'Male').length;
    document.getElementById('statGenderSplit').textContent = `${female} / ${male}`;

    /* ---- chart 1: status breakdown ---- */
    new Chart(document.getElementById('statusBarChart'), {
        type: 'bar',
        data: {
            labels: ['Pending', 'Approved', 'Rejected'],
            datasets: [{
                label: 'Applications',
                data: [
                    records.filter(r => r.status === 'pending').length,
                    records.filter(r => r.status === 'approved').length,
                    records.filter(r => r.status === 'rejected').length,
                ],
                backgroundColor: ['#ffcf4d', '#35f2a4', '#ff4d6d'],
                borderRadius: 6
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#9a9db3' }, grid: { display: false } },
                y: { ticks: { color: '#9a9db3', precision: 0 }, grid: { color: 'rgba(255,255,255,0.06)' } }
            }
        }
    });

    /* ---- chart 2: submissions per hospital ---- */
    const hospitalCounts = hospitals.map(h => records.filter(r => r.hospital === h).length);
    new Chart(document.getElementById('hospitalChart'), {
        type: 'bar',
        data: {
            labels: hospitals.length ? hospitals : ['No data yet'],
            datasets: [{
                label: 'Submissions',
                data: hospitalCounts.length ? hospitalCounts : [0],
                backgroundColor: '#00f0ff',
                borderRadius: 6
            }]
        },
        options: {
            indexAxis: 'y',
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: '#9a9db3', precision: 0 }, grid: { color: 'rgba(255,255,255,0.06)' } },
                y: { ticks: { color: '#9a9db3', font: { size: 10 } }, grid: { display: false } }
            }
        }
    });
</script>
</body>
</html>
